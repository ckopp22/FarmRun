<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm Run 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farm Run">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fd4f0">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="chickens" style="display:none">🐔 <span id="chicken-count">0</span></div>
  <div id="fps">-- fps</div>
</div>
<div id="sound">
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div id="menu-drop" style="display:none">
    <button id="shop-menu-btn">🛒 Shop</button>
    <button id="music-btn" aria-label="Music">🎵 Music</button>
    <button id="sound-btn" aria-label="Sound">🔊 Sound</button>
  </div>
</div>
<button id="pause-btn" aria-label="Pause" style="display:none">✕</button>
<div id="pause" class="overlay" style="display:none">
  <h1 class="title">Paused</h1>
  <button id="resume-btn" class="big-btn">Resume</button>
  <button id="pause-menu-btn" class="back-btn">Main Menu</button>
</div>
<div id="menu" class="overlay">
  <h1 class="title">FARM RUN</h1>
  <button id="play-btn" class="big-btn">PLAY</button>
</div>
<div id="slots" class="overlay" style="display:none">
  <h2 class="subtitle">Choose a Farm</h2>
  <div id="slot-list"></div>
  <button id="slots-back" class="back-btn">Back</button>
</div>
<div id="farm-ui" style="display:none">
  <div id="money">$0</div>
  <button id="shop-btn">🛒 Shop</button>
  <button id="sell-btn" style="display:none">SELL</button>
  <button id="run-btn" class="big-btn">RUN</button>
  <div id="animal-pop" style="display:none"></div>
  <div id="shop-panel" style="display:none">
    <h2>Shop</h2>
    <div id="shop-list"></div>
    <button id="shop-close" class="back-btn">Close</button>
  </div>
</div>
<div id="busted" class="overlay" style="display:none">
  <h1 class="title">Busted!</h1>
  <p class="msg">A rival farmer caught you. Your haul is lost.</p>
  <button id="busted-btn" class="big-btn">OK</button>
</div>
<div id="win" class="overlay" style="display:none">
  <h1 class="title">You Win!</h1>
  <p class="msg">You earned $1,000,000!</p>
  <div id="win-stats"></div>
  <button id="win-keep" class="big-btn">Keep Playing</button>
  <button id="win-menu" class="back-btn">Main Menu</button>
</div>
<button id="update-banner" style="display:none">Tap to Update</button>
<div id="fade"></div>
<div id="stick-base"><div id="stick-knob"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
