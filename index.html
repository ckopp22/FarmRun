<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm Run Fun</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farm Run Fun">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fd4f0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="chickens" style="display:none">🐔 <span id="chicken-count">0</span></div>
  <div id="fps">-- fps</div>
</div>
<div id="sound">
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div id="menu-drop" style="display:none">
    <button id="music-btn" aria-label="Music">🎵 Music</button>
    <button id="sound-btn" aria-label="Sound">🔊 Sound</button>
    <button id="fps-btn" aria-label="FPS">📊 FPS</button>
  </div>
</div>
<button id="pause-btn" aria-label="Pause" style="display:none">✕</button>
<div id="pause" class="overlay" style="display:none">
  <h1 class="title">Paused</h1>
  <button id="resume-btn" class="big-btn">Resume</button>
  <button id="pause-menu-btn" class="back-btn">Main Menu</button>
</div>
<div id="splash"><img src="icons/kopp-studios-logo.png" alt="Kopp Studios"></div>
<div id="menu" class="overlay">
  <div class="title-wrap">
    <svg class="cloud" viewBox="0 0 320 250" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="20,190 10,150 45,115 80,120 95,75 140,45 190,50 225,85 245,110 290,115 315,155 300,200 250,225 70,225" fill="#fff"/>
      <polygon points="20,190 10,150 45,115" fill="#e3f0f8"/>
      <polygon points="45,115 80,120 100,170" fill="#f7fcff"/>
      <polygon points="80,120 95,75 140,100" fill="#dcebf6"/>
      <polygon points="95,75 140,45 140,100" fill="#f7fcff"/>
      <polygon points="140,45 190,50 165,105" fill="#e3f0f8"/>
      <polygon points="190,50 225,85 165,105" fill="#fbfdff"/>
      <polygon points="225,85 245,110 200,150" fill="#dcebf6"/>
      <polygon points="245,110 290,115 270,165" fill="#f7fcff"/>
      <polygon points="290,115 315,155 270,165" fill="#e3f0f8"/>
      <polygon points="315,155 300,200 270,165" fill="#cfe3f1"/>
      <polygon points="70,225 20,190 100,170" fill="#dcebf6"/>
      <polygon points="100,170 45,115 20,190" fill="#eef7fc"/>
      <polygon points="140,100 165,105 200,150 100,170" fill="#fbfdff"/>
      <polygon points="100,170 200,150 250,225 70,225" fill="#e8f3fa"/>
      <polygon points="200,150 270,165 300,200 250,225" fill="#d6e8f4"/>
    </svg>
    <h1 class="title">FARM RUN FUN</h1>
  </div>
  <button id="play-btn" class="big-btn">PLAY</button>
  <button id="help-btn" aria-label="Help">?</button>
</div>
<div id="help" class="overlay" style="display:none">
  <h2 id="help-title" class="subtitle">Help</h2>
  <div id="help-body"></div>
  <button id="help-back" class="back-btn">Close</button>
</div>
<div id="slots" class="overlay" style="display:none">
  <h2 class="subtitle">Choose a Farm</h2>
  <div id="slot-list"></div>
  <button id="slots-back" class="back-btn">Back</button>
</div>
<div id="farm-ui" style="display:none">
  <div id="money">$0</div>
  <button id="shop-btn" aria-label="Shop"></button>
  <button id="sell-btn" style="display:none">SELL</button>
  <button id="run-btn" class="big-btn">RUN</button>
  <div id="animal-pop" style="display:none"></div>
  <div id="shop-panel" style="display:none">
    <h2>Shop</h2>
    <div id="shop-list"></div>
    <button id="shop-close" class="back-btn">Close</button>
  </div>
</div>
<div id="busted" class="overlay" style="display:none">
  <h1 class="title">Busted!</h1>
  <p class="msg">A rival farmer caught you. Your haul is lost.</p>
  <button id="busted-btn" class="big-btn">OK</button>
</div>
<div id="win" class="overlay" style="display:none">
  <h1 id="win-title" class="title">You're A Millionaire</h1>
  <p id="win-msg" class="msg">You earned $1,000,000!</p>
  <div id="win-stats"></div>
  <button id="win-keep" class="big-btn">Keep Playing</button>
  <button id="win-menu" class="back-btn">Main Menu</button>
</div>
<button id="update-banner" style="display:none">Tap to Update</button>
<div id="great-job"><h1>Great Job!</h1></div>
<div id="fade"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
