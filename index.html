<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm Run Fun</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farm Run Fun">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fd4f0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="chickens" style="display:none">🐔 <span id="chicken-count">0</span></div>
  <div id="fps">-- fps</div>
</div>
<div id="sound">
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div id="menu-drop" style="display:none">
    <button id="music-btn" aria-label="Music">🎵 Music</button>
    <button id="sound-btn" aria-label="Sound">🔊 Sound</button>
    <button id="fps-btn" aria-label="FPS">📊 FPS</button>
  </div>
</div>
<button id="pause-btn" aria-label="Pause" style="display:none">✕</button>
<div id="pause" class="overlay" style="display:none">
  <h1 class="title">Paused</h1>
  <button id="resume-btn" class="big-btn">Resume</button>
  <button id="pause-menu-btn" class="back-btn">Main Menu</button>
</div>
<div id="splash"><img src="icons/kopp-studios-logo.png" alt="Kopp Studios"></div>
<div id="menu" class="overlay">
  <div class="title-wrap">
    <svg class="cloud" viewBox="0 0 320 110" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="6,10 314,6 316,100 4,104" fill="#4a2f16"/>
      <polygon points="10,14 312,11 313,38 10,40" fill="#9a6a35"/>
      <polygon points="10,14 150,12 90,39 10,40" fill="#a9763c"/>
      <polygon points="150,12 312,11 313,38 230,38" fill="#8a5c2c"/>
      <polygon points="9,42 313,40 314,68 9,70" fill="#85572a"/>
      <polygon points="9,42 120,41 200,69 9,70" fill="#946332"/>
      <polygon points="120,41 313,40 314,68 200,69" fill="#7a4f25"/>
      <polygon points="8,72 314,70 314,96 8,98" fill="#9a6a35"/>
      <polygon points="8,72 90,71 40,97 8,98" fill="#a9763c"/>
      <polygon points="90,71 314,70 314,96 190,97 40,97" fill="#8f602f"/>
      <polygon points="190,97 314,96 314,70 270,71" fill="#80552a"/>
      <circle cx="20" cy="26" r="3" fill="#3a2410"/><circle cx="300" cy="25" r="3" fill="#3a2410"/>
      <circle cx="20" cy="84" r="3" fill="#3a2410"/><circle cx="300" cy="83" r="3" fill="#3a2410"/>
    </svg>
    <img class="title-img" src="icons/title.png" alt="Farm Run Fun">
  </div>
  <button id="play-btn" class="big-btn">PLAY</button>
  <button id="help-btn" aria-label="Help">?</button>
</div>
<div id="help" class="overlay" style="display:none">
  <h2 id="help-title" class="subtitle">Help</h2>
  <div id="help-body"></div>
  <button id="help-back" class="back-btn">Close</button>
</div>
<div id="slots" class="overlay" style="display:none">
  <h2 class="subtitle">Choose a Farm</h2>
  <div id="slot-list"></div>
  <button id="slots-back" class="back-btn">Back</button>
</div>
<div id="farm-ui" style="display:none">
  <div id="money">$0</div>
  <div id="presents" style="display:none"><i></i><i></i><i></i><i></i><i></i><span id="presents-done">Completed</span></div>
  <button id="shop-btn" aria-label="Shop"></button>
  <button id="sell-btn" style="display:none">SELL</button>
  <button id="run-btn" class="big-btn">RUN</button>
  <div id="animal-pop" style="display:none"></div>
  <div id="shop-panel" style="display:none">
    <h2>Shop</h2>
    <div id="shop-list"></div>
    <button id="shop-close" class="back-btn">Close</button>
  </div>
</div>
<div id="busted" class="overlay" style="display:none">
  <h1 class="title">Busted!</h1>
  <p class="msg">A rival farmer caught you. Your haul is lost.</p>
  <button id="busted-btn" class="big-btn">OK</button>
</div>
<div id="unwrap" class="overlay" style="display:none">
  <div id="unwrap-box"><div class="lid"></div><div class="base"></div></div>
  <div id="unwrap-text">Unwrap</div>
</div>
<div id="shirt-panel" class="overlay" style="display:none">
  <h2 class="subtitle">Dress Up</h2>
  <div id="shirt-list"></div>
  <div id="shirt-hint">Win new shirts and hats from Santa's presents!</div>
  <button id="shirt-close" class="back-btn">Close</button>
</div>
<div id="win" class="overlay" style="display:none">
  <h1 id="win-title" class="title">You Beat the Game!</h1>
  <p id="win-msg" class="msg">You earned $1,000,000!</p>
  <div id="win-stats"></div>
  <button id="win-keep" class="big-btn">Keep Playing</button>
  <button id="win-menu" class="back-btn">Main Menu</button>
</div>
<button id="update-banner" style="display:none">Tap to Update</button>
<div id="great-job"><h1>Great Job!</h1></div>
<div id="fade"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
